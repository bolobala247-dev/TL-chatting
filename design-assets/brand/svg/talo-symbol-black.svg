<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Talo symbol "The Beam" — 512 grid, stroke 88, radius 44, gap 32 -->
  <!-- Two pills = two voices; the stem passing between them = the channel that connects them -->
  <g fill="#000000">
    <rect x="48" y="64" width="132" height="88" rx="44"/>
    <rect x="332" y="64" width="132" height="88" rx="44"/>
    <rect x="212" y="64" width="88" height="384" rx="44"/>
  </g>
</svg>
